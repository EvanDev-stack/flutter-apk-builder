
name: Android Build Engine

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build Job ID
        required: true
        type: string
      userId:
        description: User ID
        required: true
        type: string
      payload:
        description: Build Payload JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Android APK Builder
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize
        id: init
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/logs"
          mkdir -p output

          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"

          node -e "
            JSON.parse(require('fs').readFileSync(
              process.argv[1], 'utf8'
            ));
          " "$RUNNER_TEMP/payload.json"

          TYPE=$(node -e "
            const p=require(process.argv[1]);
            process.stdout.write(String(p.buildType || 'release'));
          " "$RUNNER_TEMP/payload.json")

          TYPE=$(echo "$TYPE" | tr '[:upper:]' '[:lower:]')

          if [[ "$TYPE" != "debug" && "$TYPE" != "release" ]]; then
            TYPE=release
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

          {
            echo "# Android Build Report"
            echo ""
            echo "- Job: $JOB_ID"
            echo "- User: $USER_ID"
            echo "- Variant: $TYPE"
            echo "- Runner: $RUNNER_OS"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          ZIP_URL=$(node -e "
            const p=require(process.argv[1]);
            process.stdout.write(p.zipAssetUrl || '');
          " "$RUNNER_TEMP/payload.json")

          SOURCE_URL=$(node -e "
            const p=require(process.argv[1]);
            process.stdout.write(p.url || p.sourceUrl || '');
          " "$RUNNER_TEMP/payload.json")

          if [[ -n "$ZIP_URL" ]]; then
            curl -fL --retry 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ZIP_URL" -o "$RUNNER_TEMP/project.zip"

          elif [[ -n "$SOURCE_URL" ]]; then
            curl -fL --retry 4 --retry-all-errors \
              "$SOURCE_URL" -o "$RUNNER_TEMP/project.zip"

          else
            echo "::error::Project URL or ZIP asset missing"
            exit 1
          fi

          unzip -q "$RUNNER_TEMP/project.zip" \
            -d "$RUNNER_TEMP/source"

          ROOT=$(find "$RUNNER_TEMP/source" \
            -type f \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -printf '%h\n' | sort | head -n1)

          if [[ -z "$ROOT" ]]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Detect Android Requirements
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          SDK=$(grep -RhoE \
            'compileSdk(Version)?[[:space:]]*(=|[[:space:]])[[:space:]]*[0-9]+' \
            . --include='*.gradle' --include='*.gradle.kts' \
            | grep -Eo '[0-9]+' | head -n1 || true)

          SDK=${SDK:-35}

          if ! [[ "$SDK" =~ ^[0-9]+$ ]] || (( SDK < 21 || SDK > 100 )); then
            SDK=35
          fi

          echo "Detected SDK: $SDK"

          yes | sdkmanager --licenses >/dev/null || true

          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-$SDK" >/dev/null

          BUILD_TOOLS=$(sdkmanager --list 2>/dev/null \
            | sed -nE 's/^[[:space:]]*build-tools;([0-9.]+)[[:space:]]*\|.*/\1/p' \
            | sort -V | tail -n1)

          if [[ -n "$BUILD_TOOLS" ]]; then
            yes | sdkmanager "build-tools;$BUILD_TOOLS" >/dev/null
          fi

          NDK=$(grep -RhoE \
            "ndkVersion[[:space:]]*[= ]+[\"'][0-9.]+" \
            . --include='*.gradle' --include='*.gradle.kts' \
            | grep -Eo '[0-9]+(\.[0-9]+)+' | head -n1 || true)

          if [[ -n "$NDK" ]]; then
            yes | sdkmanager "ndk;$NDK" >/dev/null
          fi

          echo "SDK=$SDK" >> "$GITHUB_ENV"

          {
            echo "## Android Resources"
            echo "- Android SDK: $SDK"
            echo "- Build Tools: ${BUILD_TOOLS:-Not detected}"
            echo "- NDK: ${NDK:-Not required}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          if [[ ! -f gradlew ]]; then
            echo "::error::Gradle wrapper missing"
            exit 1
          fi

          if [[ ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::error::Gradle wrapper properties missing"
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version \
            --no-daemon 2>&1 \
            | tee "$RUNNER_TEMP/logs/gradle.log"

      - name: Build APK with Recovery
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          TYPE="${{ steps.init.outputs.type }}"
          TASK="assemble${TYPE^}"

          LOG="$RUNNER_TEMP/logs/build.log"
          SUCCESS=0

          build() {
            local attempt="$1"
            shift

            echo "::group::Build Attempt $attempt"

            set +e
            ./gradlew "$@" \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              2>&1 | tee -a "$LOG"

            CODE=${PIPESTATUS[0]}
            set -e

            echo "::endgroup::"

            return "$CODE"
          }

          # Attempt 1: Normal build
          build 1 "$TASK" && SUCCESS=1 || true

          # Attempt 2: Refresh dependency metadata
          if [[ "$SUCCESS" -eq 0 ]]; then
            echo "::warning::Retrying with refreshed dependencies"
            build 2 --refresh-dependencies "$TASK" && SUCCESS=1 || true
          fi

          # Attempt 3: Clean generated outputs
          if [[ "$SUCCESS" -eq 0 ]]; then
            echo "::warning::Cleaning project build outputs"
            ./gradlew clean --no-daemon 2>&1 | tee -a "$LOG" || true
            build 3 --refresh-dependencies "$TASK" && SUCCESS=1 || true
          fi

          # Attempt 4: Final retry
          if [[ "$SUCCESS" -eq 0 ]]; then
            echo "::warning::Final retry"
            build 4 "$TASK" --rerun-tasks && SUCCESS=1 || true
          fi

          if [[ "$SUCCESS" -eq 0 ]]; then
            echo "::error::Build failed after recovery attempts"
            exit 1
          fi

          APK=$(find . -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | grep -i "/$TYPE/" | head -n1)

          if [[ -z "$APK" ]]; then
            echo "::error::APK output not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/"

          echo "Build successful: $APK"

      - name: Validate APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find output -type f -name "*.apk" | head -n1)

          test -n "$APK"

          SIZE=$(stat -c%s "$APK")
          HASH=$(sha256sum "$APK" | awk '{print $1}')

          if (( SIZE < 10240 )); then
            echo "::error::APK file is too small"
            exit 1
          fi

          {
            echo "## APK Validation"
            echo "- File: $(basename "$APK")"
            echo "- Size: $SIZE bytes"
            echo "- SHA256: $HASH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ inputs.jobId }}
          path: ${{ runner.temp }}/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Final Summary
        if: always()
        run: |
          {
            echo ""
            echo "## Final Status"
            echo "- Status: ${{ job.status }}"
            echo "- Job: $JOB_ID"
            echo "- Variant: ${{ steps.init.outputs.type }}"
          } >> "$GITHUB_STEP_SUMMARY"
